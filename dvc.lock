schema: '2.0'
stages:
  prepare:
    cmd: python -m src.prepare
    deps:
    - path: data/batches/version_1.csv
      hash: md5
      md5: 1922a2852d2ac38139595dca9945fbdd
      size: 1063231
    - path: src/config.py
      hash: md5
      md5: f4d5992f9f94dbf82dc3cfe861b93c80
      size: 1896
    - path: src/prepare.py
      hash: md5
      md5: 7536a6b89f649ca1a97aaad38730f793
      size: 1771
    params:
      params.yaml:
        data.age_column: person_age
        data.employment_length_column: person_emp_length
        data.income_cap_enabled: false
        data.income_cap_quantile: 0.99
        data.income_column: person_income
        data.max_age: 80
        data.min_age: 18
        data.minimum_working_age: 16
        project.feature_columns:
        - person_age
        - person_income
        - person_home_ownership
        - person_emp_length
        - loan_intent
        - loan_grade
        - loan_amnt
        - loan_int_rate
        - loan_percent_income
        - cb_person_default_on_file
        - cb_person_cred_hist_length
        project.target_column: loan_status
    outs:
    - path: data/processed/clean.csv
      hash: md5
      md5: bf68b22371e488643265635f9ff33b95
      size: 1054558
  train:
    cmd: python -m src.train
    deps:
    - path: data/processed/clean.csv
      hash: md5
      md5: bf68b22371e488643265635f9ff33b95
      size: 1054558
    - path: src/config.py
      hash: md5
      md5: f4d5992f9f94dbf82dc3cfe861b93c80
      size: 1896
    - path: src/metrics.py
      hash: md5
      md5: 360a5f46cf26f92cf4859abbcec72117
      size: 2426
    - path: src/train.py
      hash: md5
      md5: 4ee3b548d1f65608285c8eeecf2dab01
      size: 9666
    params:
      params.yaml:
        data.missing_indicator: true
        data.random_seed: 42
        data.test_size: 0.2
        models:
          selected:
          - logistic_regression
          - random_forest
          - xgboost
          decision_threshold: 0.5
          shap_summary_enabled: false
          shap_sample_size: 60
          logistic_regression:
            class_path: sklearn.linear_model.LogisticRegression
            imbalance_parameter: class_weight
            parameters:
              max_iter: 1000
              C: 1.0
          random_forest:
            class_path: sklearn.ensemble.RandomForestClassifier
            imbalance_parameter: class_weight
            parameters:
              n_estimators: 120
              max_depth: 12
              min_samples_leaf: 2
              n_jobs: -1
          xgboost:
            class_path: xgboost.XGBClassifier
            imbalance_parameter: scale_pos_weight
            parameters:
              n_estimators: 120
              max_depth: 5
              learning_rate: 0.08
              subsample: 0.9
              colsample_bytree: 0.9
              objective: binary:logistic
              eval_metric: logloss
              n_jobs: -1
        paths.confusion_matrix_filename: confusion_matrix.json
        paths.mlflow_artifact_path: artifacts
        paths.pr_plot_filename: precision_recall_curve.png
        paths.roc_plot_filename: roc_curve.png
        project.categorical_features:
        - person_home_ownership
        - loan_intent
        - loan_grade
        - cb_person_default_on_file
        project.feature_columns:
        - person_age
        - person_income
        - person_home_ownership
        - person_emp_length
        - loan_intent
        - loan_grade
        - loan_amnt
        - loan_int_rate
        - loan_percent_income
        - cb_person_default_on_file
        - cb_person_cred_hist_length
        project.numeric_features:
        - person_age
        - person_income
        - person_emp_length
        - loan_amnt
        - loan_int_rate
        - loan_percent_income
        - cb_person_cred_hist_length
        project.target_column: loan_status
        registry.experiment_name: loan-default-risk
        registry.model_artifact_path: pipeline
        registry.model_name: loan-default-classifier
        registry.selection_metric: roc_auc
        registry.tracking_uri: ${MLFLOW_TRACKING_URI:-sqlite:///mlflow.db}
        registry.training_evaluation_artifact_path: evaluation
    outs:
    - path: data/processed/test.csv
      hash: md5
      md5: 4d369f67432e118aedf53bc2cd1ffa64
      size: 211165
    - path: data/processed/train.csv
      hash: md5
      md5: 65810b0c6515c37517ca5e8df56c5af3
      size: 843591
    - path: reports/training_summary.json
      hash: md5
      md5: 3e92ffe8eebc2669a012820b479906ec
      size: 1608
  evaluate:
    cmd: python -m src.evaluate
    deps:
    - path: data/processed/test.csv
      hash: md5
      md5: 4d369f67432e118aedf53bc2cd1ffa64
      size: 211165
    - path: reports/training_summary.json
      hash: md5
      md5: 3e92ffe8eebc2669a012820b479906ec
      size: 1608
    - path: src/evaluate.py
      hash: md5
      md5: 1eb85ddecf508a925ea5b25a0781e44d
      size: 2483
    - path: src/metrics.py
      hash: md5
      md5: 360a5f46cf26f92cf4859abbcec72117
      size: 2426
    params:
      params.yaml:
        models.decision_threshold: 0.5
        paths.confusion_matrix_filename: confusion_matrix.json
        paths.evaluation_artifact_dir: reports/evaluation
        paths.metrics_path: reports/metrics.json
        paths.pr_plot_filename: precision_recall_curve.png
        paths.roc_plot_filename: roc_curve.png
        registry.final_evaluation_artifact_path: final_evaluation
        registry.model_artifact_path: pipeline
        registry.tracking_uri: ${MLFLOW_TRACKING_URI:-sqlite:///mlflow.db}
    outs:
    - path: reports/metrics.json
      hash: md5
      md5: 5c1908d80102699950ca6930d438fca4
      size: 486
