services:
  mlflow:
    build: .
    command: >
      sh -c "mlflow server --host $${API_HOST:-0.0.0.0}
      --port $${MLFLOW_PORT:-5000}
      --backend-store-uri $${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root $${MLFLOW_ARTIFACT_ROOT}
      --serve-artifacts --artifacts-destination $${MLFLOW_ARTIFACT_ROOT}"
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:-sqlite:////app/mlflow/mlflow.db}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-file:///app/mlflow/artifacts}
    ports:
      - "${MLFLOW_PORT:-5000}:${MLFLOW_PORT:-5000}"
    volumes:
      - mlflow-data:/app/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('MLFLOW_PORT','5000')+'/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      HEALTH_PATH: ${HEALTH_PATH:-/health}
      LOG_FILE: ${LOG_FILE:-logs/predictions.jsonl}
      MLFLOW_TRACKING_URI: http://mlflow:${MLFLOW_PORT:-5000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - shared-logs:/app/logs
      - shared-artifacts:/app/artifacts
      - mlflow-data:/app/mlflow
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('API_PORT','8000')+os.getenv('HEALTH_PATH','/health'),timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mlflow-data:
  shared-logs:
  shared-artifacts:
